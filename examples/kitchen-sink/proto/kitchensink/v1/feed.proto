// This service has only server-streaming RPCs.

syntax = "proto3";

package kitchensink.v1;

option go_package = "github.com/braveokafor/protoc-gen-cli/examples/kitchen-sink/go-cobra/gen/kitchensink/v1;kitchensinkv1";

// FeedService streams fake events.
service FeedService {
  // Tail streams the requested number of events and then ends the feed.
  rpc Tail(TailRequest) returns (stream FeedEvent);
}

message TailRequest {
  int32 count = 1;
}

message FeedEvent {
  int32 index = 1;
  string note = 2;
}
