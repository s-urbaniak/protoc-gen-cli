syntax = "proto3";

package kitchensink.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/braveokafor/proto-to-cli/examples/kitchen-sink/go-cobra/gen/kitchensink/v1;kitchensinkv1";

// FieldsService exercises the flag surface, one RPC per field-shape family.
// Every RPC echoes its request, so the response shows exactly what arrived.
service FieldsService {
  // Scalars carries every scalar width the plugin derives a flag for.
  rpc Scalars(ScalarsRequest) returns (ScalarsRequest) {}
  // Messages carries every shape of message field.
  rpc Messages(MessagesRequest) returns (MessagesRequest) {}
}

message ScalarsRequest {
  double double_field = 1;
  float float_field = 2;
  int32 int32_field = 3;
  int64 int64_field = 4;
  uint32 uint32_field = 5;
  uint64 uint64_field = 6;
  sint32 sint32_field = 7;
  sint64 sint64_field = 8;
  fixed32 fixed32_field = 9;
  fixed64 fixed64_field = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool bool_field = 13;
  string string_field = 14;
}

message MessagesRequest {
  Outer outer = 1;
  Outer kebab_outer = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated Outer outers = 4;
  map<string, string> labels = 5;
  google.protobuf.Duration duration = 6;
  google.protobuf.FieldMask field_mask = 7;
  google.protobuf.Struct struct = 8;
  Recursive recursive = 9;
  Odd odd = 10;
}

message Outer {
  string string_leaf = 1;
  int64 int64_leaf = 2;
  Middle middle = 3;
}

message Middle {
  string leaf = 1;
  Inner inner = 2;
}

message Inner {
  string leaf = 1;
  Deep deep = 2;
}

message Deep {
  string leaf = 1;
  Deeper deeper = 2;
}

message Deeper {
  string leaf = 1;
  Deepest deepest = 2;
}

message Deepest {
  string leaf = 1;
}

message Recursive {
  string name = 1;
  Recursive next = 2;
}

message Odd {
  Even even = 1;
}

message Even {
  Odd odd = 1;
}
