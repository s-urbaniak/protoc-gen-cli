syntax = "proto3";

package kitchensink.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/braveokafor/proto-to-cli/examples/kitchen-sink/go-cobra/gen/kitchensink/v1;kitchensinkv1";

// FieldsService exercises the flag surface, one RPC per field-shape family.
// Every RPC echoes its request, so the response shows exactly what arrived.
service FieldsService {
  // Scalars carries every scalar width the plugin derives a flag for.
  rpc Scalars(ScalarsRequest) returns (ScalarsRequest) {}
  // Messages carries every shape of message field.
  rpc Messages(MessagesRequest) returns (MessagesRequest) {}
  // Repeated carries one repeated field per bind family.
  rpc Repeated(RepeatedRequest) returns (RepeatedRequest) {}
  // Maps carries one map field per bind family, plus integer and bool keys.
  rpc Maps(MapsRequest) returns (MapsRequest) {}
  // Wrappers carries the nine wrapper types plus repeated and map compositions.
  rpc Wrappers(WrappersRequest) returns (WrappersRequest) {}
  // WellKnown carries the document-form well-known types.
  rpc WellKnown(WellKnownRequest) returns (WellKnownRequest) {}
  // Enums carries an enum in every shape, plus aliases and a nested enum.
  rpc Enums(EnumsRequest) returns (EnumsRequest) {}
  // Oneofs carries a scalar-and-enum oneof, a message-and-scalar oneof, and a
  // single-member oneof.
  rpc Oneofs(OneofsRequest) returns (OneofsRequest) {}
  // Optionals carries proto3 optional fields.
  rpc Optionals(OptionalsRequest) returns (OptionalsRequest) {}
}

message ScalarsRequest {
  double double_field = 1;
  float float_field = 2;
  int32 int32_field = 3;
  int64 int64_field = 4;
  uint32 uint32_field = 5;
  uint64 uint64_field = 6;
  sint32 sint32_field = 7;
  sint64 sint64_field = 8;
  fixed32 fixed32_field = 9;
  fixed64 fixed64_field = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool bool_field = 13;
  string string_field = 14;
  bytes bytes_field = 15;
}

message MessagesRequest {
  Outer outer = 1;
  Outer kebab_outer = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated Outer outers = 4;
  map<string, string> labels = 5;
  google.protobuf.Duration duration = 6;
  google.protobuf.FieldMask field_mask = 7;
  google.protobuf.Struct struct = 8;
  Recursive recursive = 9;
  Odd odd = 10;
}

message RepeatedRequest {
  repeated string strings = 1;
  repeated bool bools = 2;
  repeated int64 ints = 3;
  repeated uint64 uints = 4;
  repeated double doubles = 5;
  repeated google.protobuf.Timestamp timestamps = 6;
  repeated Outer outers = 7;
}

message MapsRequest {
  map<string, string> string_values = 1;
  map<string, bool> bool_values = 2;
  map<string, int64> int64_values = 3;
  map<string, uint64> uint64_values = 4;
  map<string, double> double_values = 5;
  map<string, google.protobuf.Timestamp> timestamp_values = 6;
  map<string, Outer> outer_values = 7;
  map<int64, string> int64_keys = 8;
  map<bool, string> bool_keys = 9;
}

message WrappersRequest {
  google.protobuf.DoubleValue double_value = 1;
  google.protobuf.FloatValue float_value = 2;
  google.protobuf.Int64Value int64_value = 3;
  google.protobuf.UInt64Value uint64_value = 4;
  google.protobuf.Int32Value int32_value = 5;
  google.protobuf.UInt32Value uint32_value = 6;
  google.protobuf.BoolValue bool_value = 7;
  google.protobuf.StringValue string_value = 8;
  google.protobuf.BytesValue bytes_value = 9;
  repeated google.protobuf.StringValue repeated_strings = 10;
  map<string, google.protobuf.BoolValue> bool_map = 11;
}

message WellKnownRequest {
  google.protobuf.Struct struct = 1;
  google.protobuf.Value value = 2;
  google.protobuf.ListValue list_value = 3;
  google.protobuf.Any any = 4;
  google.protobuf.Empty empty = 5;
}

enum Choice {
  CHOICE_UNSPECIFIED = 0;
  CHOICE_FIRST = 1;
  CHOICE_SECOND = 2;
}

enum Aliased {
  option allow_alias = true;
  ALIASED_UNSPECIFIED = 0;
  ALIASED_A = 1;
  ALIASED_ALPHA = 1;
  ALIASED_B = 2;
}

message EnumsRequest {
  enum Nested {
    NESTED_UNSPECIFIED = 0;
    NESTED_ONE = 1;
  }
  Choice choice = 1;
  repeated Choice choices = 2;
  optional Choice optional_choice = 3;
  map<string, Choice> choice_map = 4;
  Aliased aliased = 5;
  Nested nested = 6;
}

message OneofsRequest {
  oneof choice {
    string text = 1;
    int32 count = 2;
    Choice pick = 3;
  }
  oneof payload {
    Outer outer = 4;
    bool enabled = 5;
    google.protobuf.Timestamp when = 6;
  }
  oneof solo {
    string only = 7;
  }
}

message OptionalsRequest {
  optional string name = 1;
  optional int32 age = 2;
  optional Choice pick = 3;
}

message Outer {
  string string_leaf = 1;
  int64 int64_leaf = 2;
  Middle middle = 3;
}

message Middle {
  string leaf = 1;
  Inner inner = 2;
}

message Inner {
  string leaf = 1;
  Deep deep = 2;
}

message Deep {
  string leaf = 1;
  Deeper deeper = 2;
}

message Deeper {
  string leaf = 1;
  Deepest deepest = 2;
}

message Deepest {
  string leaf = 1;
}

message Recursive {
  string name = 1;
  Recursive next = 2;
}

message Odd {
  Even even = 1;
}

message Even {
  Odd odd = 1;
}
