// This service has only bidi RPCs.

syntax = "proto3";

package kitchensink.v1;

option go_package = "github.com/braveokafor/protoc-gen-cli/examples/kitchen-sink/go-cobra/gen/kitchensink/v1;kitchensinkv1";

// RelayService echoes each note back as it arrives.
service RelayService {
  // Chat echoes each note as it arrives.
  rpc Chat(stream ChatNote) returns (stream ChatNote);
}

message ChatNote {
  string text = 1;
}
