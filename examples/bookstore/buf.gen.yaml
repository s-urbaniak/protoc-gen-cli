version: v2
managed:
  enabled: false
plugins:
  - local: [go, tool, protoc-gen-go]
    out: go-cobra/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-go-grpc]
    out: go-cobra/gen
    opt: [paths=source_relative]
  - local: protoc-gen-cli
    out: go-cobra/gen
    opt: [paths=source_relative, dump-ir=true]
inputs:
  - directory: proto
