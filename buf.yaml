version: v2
modules:
  - path: proto
    name: buf.build/braveokafor/proto-to-cli-cli
  - path: examples/bookstore/proto
  - path: examples/bookstore-annotated/proto
  - path: examples/kitchen-sink/proto
lint:
  use:
    - STANDARD
  except:
    - ENUM_NO_ALLOW_ALIAS
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    RPC_PASCAL_CASE:
      - examples/kitchen-sink/proto/kitchensink/v1/names.proto
    FIELD_LOWER_SNAKE_CASE:
      - examples/kitchen-sink/proto/kitchensink/v1/names.proto
breaking:
  use:
    - FILE
